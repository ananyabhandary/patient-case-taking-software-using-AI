{% extends 'base.html' %}{% block body %}
<div class="card auth"><h2>Enter verification code</h2><p class="muted">We sent a 6-digit code to your email. It expires in 5 minutes.</p>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="code">Code</label>
<input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus autocomplete="one-time-code"><br><br><button>Verify</button></form></div>{% endblock %}

{% extends 'base.html' %}{% block body %}
<div class="authwrap">{% include '_authart.html' %}<div class="card auth"><h2>Welcome</h2><div class="tabs"><a href="{{ url_for('home') }}">Sign in</a><a class="on" href="{{ url_for('register') }}">Create account</a></div>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label for="name">Full name</label><input id="name" name="name" required>
<label for="email">Email</label><input id="email" name="email" type="email" required>
<label for="phone">Phone (10 digits)</label><input id="phone" name="phone" pattern="[0-9]{10}" required>
<label for="password">Password</label><div class="pw"><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password"><button type="button" class="eye" data-eye="password" aria-label="Show password"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<p class="muted">At least 8 characters with letters and numbers. A verification code is sent to your email.</p><button class="full">Create account</button></form></div></div>{% endblock %}

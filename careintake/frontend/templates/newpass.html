{% extends 'base.html' %}{% block body %}
<div class="card auth"><h2>Choose a new password</h2>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="password">New password</label><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password">
<label for="again">Repeat password</label><input id="again" name="again" type="password" minlength="8" required autocomplete="new-password"><p class="muted">At least 8 characters with letters and numbers.</p><button>Save password</button></form></div>{% endblock %}
